<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ირინა & გიორგი | ქორწილი</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Playfair Display',serif;
  background:radial-gradient(circle at top,#fff8ef,#f3e6d3,#e8d3a8);
  overflow-x:hidden;
  color:#3a2a1a;
}

/* ✨ GOLD SPARKLE BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,215,0,0.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(255,215,0,0.2), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(255,215,0,0.15), transparent 50%);
  pointer-events:none;
  z-index:0;
}

/* GOLD ORNAMENT TOP */
body::after{
  content:"✦ ✧ ✦ ✧ ✦ ✧ ✦";
  position:fixed;
  top:10px;
  width:100%;
  text-align:center;
  color:gold;
  font-size:18px;
  letter-spacing:10px;
  opacity:0.6;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}

/* NAME */
.hero h1{
  font-family:'Great Vibes',cursive;
  font-size:78px;
  background:linear-gradient(45deg,#b8860b,#ffd700,#fff3b0,#b8860b);
  background-size:300% auto;
  -webkit-background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite;
  text-shadow:0 0 30px rgba(255,215,0,0.3);
}

@keyframes shine{
  0%{background-position:0%;}
  100%{background-position:200%;}
}

.hero p{
  margin-top:10px;
  font-size:18px;
  opacity:0.85;
}

/* GOLD DECORATIVE LINE */
.divider{
  margin:20px auto;
  width:200px;
  height:2px;
  background:linear-gradient(90deg,transparent,gold,transparent);
}

/* ❤️ HEARTS (GOLD + RED MIX) */
.heart{
  position:absolute;
  font-size:16px;
  animation:float 8s linear infinite;
  opacity:0.7;
}

@keyframes float{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}

/* ✨ ORNAMENT CORNERS */
.corner{
  position:absolute;
  font-size:40px;
  color:gold;
  opacity:0.5;
}
.corner.tl{top:10px;left:10px;}
.corner.tr{top:10px;right:10px;}
.corner.bl{bottom:10px;left:10px;}
.corner.br{bottom:10px;right:10px;}

/* ===== 3D SLIDER LUXURY ===== */
.slider-wrapper{
  perspective:1200px;
  margin:60px auto;
  display:flex;
  justify-content:center;
}

.slider{
  width:340px;
  height:230px;
  position:relative;
  transform-style:preserve-3d;
  animation:rotate 14s infinite linear;
}

.slide{
  position:absolute;
  width:320px;
  height:210px;
  left:10px;
  top:10px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  border:2px solid rgba(255,215,0,0.4);
}

/* gold frames */
.slide::after{
  content:"";
  position:absolute;
  inset:0;
  border:2px solid gold;
  opacity:0.2;
  border-radius:18px;
}

/* 3D positions */
.slide:nth-child(1){transform:rotateY(0deg) translateZ(420px);}
.slide:nth-child(2){transform:rotateY(90deg) translateZ(420px);}
.slide:nth-child(3){transform:rotateY(180deg) translateZ(420px);}
.slide:nth-child(4){transform:rotateY(270deg) translateZ(420px);}

@keyframes rotate{
  0%{transform:rotateY(0deg);}
  100%{transform:rotateY(360deg);}
}

/* SECTIONS */
section{
  padding:80px 20px;
  text-align:center;
  position:relative;
  z-index:2;
}

h2{
  font-size:30px;
  color:#b8860b;
  text-shadow:0 2px 10px rgba(255,215,0,0.3);
}

/* CARD LUXURY */
.card{
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,215,0,0.3);
  padding:22px;
  border-radius:18px;
  max-width:420px;
  margin:20px auto;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* BUTTON */
button{
  background:linear-gradient(45deg,#b8860b,#ffd700);
  color:#fff;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(255,215,0,0.3);
}

/* MUSIC */
#musicBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:linear-gradient(45deg,#b8860b,#ffd700);
  padding:12px;
  border-radius:50%;
  border:none;
  color:#fff;
}
</style>
</head>

<body>

<!-- ✨ ORNAMENTS -->
<div class="corner tl">✦</div>
<div class="corner tr">✦</div>
<div class="corner bl">✦</div>
<div class="corner br">✦</div>

<!-- HERO -->
<div class="hero">
  <h1>ირინა & გიორგი</h1>
  <div class="divider"></div>
  <p>გიწვევთ ქორწილში</p>
  <p>13 სექტემბერი, 2026 • ზუგდიდი</p>
</div>

<!-- ❤️ HEARTS -->
<script>
for(let i=0;i<25;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤";
  h.style.left=Math.random()*100+"vw";
  h.style.color=Math.random()>0.5?"gold":"#ff2d55";
  h.style.animationDuration=(5+Math.random()*6)+"s";
  document.body.appendChild(h);
}
</script>

<!-- 💍 3D SLIDER -->
<section>
  <h2>ჩვენი მომენტები</h2>

  <div class="slider-wrapper">
    <div class="slider">

      <div class="slide" style="background:#fff1d6;"></div>
      <div class="slide" style="background:#ffe4b5;"></div>
      <div class="slide" style="background:#f7d9a3;"></div>
      <div class="slide" style="background:#fff8e7;"></div>

    </div>
  </div>
</section>

<!-- DETAILS -->
<section>
  <h2>დეტალები</h2>
  <div class="card">
    <p>გელოდებით ამ განსაკუთრებულ დღეს 💍</p>
  </div>
</section>

</body>
</html>
